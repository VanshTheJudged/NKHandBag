name: Supabase Keepalive

on:
  schedule:
    # Every Monday at 12:00 UTC — well under the 7-day Supabase pause window
    - cron: '0 12 * * 1'
  workflow_dispatch:

# Needed so the workflow can push the timestamp commit back to the repo,
# which resets GitHub's 60-day scheduled-workflow inactivity timer.
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -o /tmp/body -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/reviews?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $code"
          cat /tmp/body
          if [ "$code" -ge 400 ]; then
            exit 1
          fi

      - name: Update keepalive timestamp
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: keepalive ping [skip ci]"
            git push
          fi
